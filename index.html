<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utopia — Sign in</title>
<style>
:root{--ink:#13212d;--muted:#66727e;--line:#dfe5e8;--paper:#f5f7f6;--navy:#241B3D;--teal:#6C4FD6;--orange:#E14F73}
*{box-sizing:border-box}
body{background:var(--navy);color:#eaf2f2;margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;padding:20px}
.card{background:#fff;color:var(--ink);border-radius:14px;padding:34px 32px;width:min(360px,100%);box-shadow:0 28px 80px #00000040}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;margin-bottom:22px}
.brand-mark{background:#6C4FD6;color:#fff;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;font-size:15px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:20px;margin:0 0 6px}
p{color:var(--muted);font-size:12.5px;margin:0 0 20px;line-height:1.5}
input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14px;margin-bottom:12px}
button{width:100%;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:12px;font-size:13px;font-weight:700;cursor:pointer}
button:hover{background:#5b3ec2}
.error{color:#b34e2e;font-size:11.5px;margin:-4px 0 12px;display:none}
.error.show{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="brand-mark">U</span><span>UTOPIA</span></div>
  <h1>Sign in</h1>
  <p>This is a private pilot-prep preview. Enter the access code to continue.</p>
  <form id="gateForm">
    <input type="password" id="pw" placeholder="Access code" autocomplete="current-password" autofocus>
    <div class="error" id="err">Incorrect code — try again.</div>
    <button type="submit">Continue</button>
  </form>
</div>
<script>
// Lightweight deterrent, not real security -- see CLAUDE.md "Hosting & access
// gate" for exactly what this does and doesn't protect against, and what a
// real pilot needs instead before any real ERP data flows through this.
var ACCESS_CODE = "PuertoCortes2026";

document.getElementById('gateForm').addEventListener('submit', function(e){
  e.preventDefault();
  var val = document.getElementById('pw').value;
  if(val === ACCESS_CODE){
    sessionStorage.setItem('ruta_authed', '1');
    window.location.href = 'ruta-dashboard-fixed.html';
  } else {
    document.getElementById('err').classList.add('show');
  }
});
</script>
</body>
</html>
